<svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>

<symbol id="i-place" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11s-7-6-7-11a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.2"/></symbol>

<header class="top">
  <div class="wrap top-inner">
    <div class="partners"><span class="partner-ad">ADMICRO</span><i aria-hidden="true"></i><span class="partner-bbk">bbk!</span><i class="air-divider" aria-hidden="true"></i><span class="partner-air">Vietravel Airlines</span></div>
    <div class="controls">
      <div id="languages" class="languages" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
        <button type="button" data-lang="zh" lang="zh-Hans" aria-label="中文" aria-pressed="false">中文</button>
        <button type="button" data-lang="vi" lang="vi" aria-label="Tiếng Việt" aria-pressed="false">VI</button>
      </div>
      <div class="mobile-language">
        <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65"><use href="#i-globe"/></svg>
        <select id="mobile-language" aria-label="Language"><option value="en" lang="en">EN</option><option value="zh" lang="zh-Hans">中文</option><option value="vi" lang="vi">VI</option></select>
        <svg class="select-chevron" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-chevron"/></svg>
      </div>
      <button id="lock" class="lock" type="button" aria-label="Lock document" title="Lock document" hidden><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-lock"/></svg></button>

</header>
<main id="gate" class="wrap stage">
  <section class="glass access" aria-labelledby="gate-title">
    <div class="optic" aria-hidden="true"></div>
    <div class="access-copy">
      <span class="eyebrow"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-lock"/></svg><span id="gate-badge">Confidential</span></span>
      <h1 class="display" id="gate-title">Meeting minutes</h1>
      <p class="deck" id="gate-lead">19 November 2026</p>
    </div>
    <form class="access-form" id="access-form">
      <h2 id="form-title">Access the document</h2>
      <label for="entry" id="form-label">Access code</label>
      <input type="pass&#119;ord" id="entry" inputmode="numeric" maxlength="6" autocomplete="off" aria-describedby="preview-note feedback">
      <button class="primary" id="submit" type="submit" disabled><span id="submit-label">Open meeting minutes</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-arrow"/></svg></button>
      <p class="preview-note" id="preview-note">If you are viewing a file preview, open the page in a browser to unlock it.</p>
      <p class="feedback" id="feedback" role="alert"></p>
    </form>
  </section>
</main>
<div id="document" hidden></div>
<script id="bundle-meta" type="application/json">{"salt":"hBt33fx7bw9zRpFE3W31Dw==","iterations":600000,"iv":{"content":"0W9IEyK/PS6BnbKw","mom":"eQTYggWH1A4QXXBF","admicro":"nOjaRk5nZQWHlvsv","bbk":"slX+L6ympp+bybpS"}}</script>
<script>
'use strict';
const labels = {
  en: {locale:'en',lang:'Language',gate:'Meeting minutes',date:'19 November 2026',badge:'Confidential',form:'Access the document',label:'Access code',open:'Open meeting minutes',busy:'Opening…',invalid:'Enter the correct six-digit access code.',unavailable:'Open the hosted HTTPS page to unlock the minutes.',assetsError:'Could not load the document. Check that the assets folder was uploaded next to this page.',lock:'Lock document',skip:'Skip to meeting minutes',nav:'Contents',download:'Download MoM PDF',downLabel:'Download PDF',downloadError:'Unable to open this PDF. Try again.'},
  zh: {locale:'zh-Hans',lang:'语言',gate:'会议纪要',date:'2026年11月19日',badge:'保密文件',form:'访问文档',label:'访问码',open:'打开会议纪要',busy:'正在打开…',invalid:'请输入正确的六位数字访问码。',unavailable:'请通过已发布页面的 HTTPS 地址打开会议纪要。',assetsError:'无法加载文档。请检查 assets 文件夹是否已与此页面一起上传。',lock:'锁定文档',skip:'跳转至会议纪要',nav:'目录',download:'下载会议纪要 PDF',downLabel:'下载 PDF',downloadError:'无法打开此 PDF，请重试。'},
  vi: {locale:'vi',lang:'Ngôn ngữ',gate:'Biên bản cuộc họp',date:'19 tháng 11 năm 2026',badge:'Tài liệu bảo mật',form:'Truy cập tài liệu',label:'Mã truy cập',open:'Mở biên bản',busy:'Đang mở…',invalid:'Vui lòng nhập đúng mã truy cập gồm 6 chữ số.',unavailable:'Mở đường dẫn HTTPS đã triển khai để truy cập biên bản.',assetsError:'Chưa tải được biên bản. Hãy kiểm tra thư mục assets đã được tải lên cùng trang này.',lock:'Khóa tài liệu',skip:'Đến nội dung biên bản',nav:'Mục lục',download:'Tải biên bản PDF',downLabel:'Tải PDF',downloadError:'Chưa thể mở tệp PDF. Vui lòng thử lại.'}
};
const ids = ['overview','business','partners','strategy','actions','documents'];
const fileIds = ['mom','admicro','bbk'];
const fileNames = ['MoM_Vietravel-Airlines_VCCorp_bbk_2026-11-19.pdf','ADMICRO_Company-Profile_2026.pdf','bbk_Company-Profile_2026.pdf'];
const $ = id => document.getElementById(id);
const form = $('access-form');
const entry = $('entry');
const canUnlock = Boolean(globalThis.crypto?.subtle) && location.protocol !== 'file:';
$('preview-note').hidden = canUnlock;
$('submit').disabled = !canUnlock;
const meta = JSON.parse($('bundle-meta').textContent);
const encode = new TextEncoder();
const decode = new TextDecoder();
const icon = name => `<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg>`;
const safe = part => String(part).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const bytes = base64 => typeof Uint8Array.fromBase64 === 'function' ? Uint8Array.fromBase64(base64) : Uint8Array.from(atob(base64), char => char.charCodeAt(0));
let lang = 'en';
let content = null;
let key = null;
let error = '';
let busy = false;
let viewVersion = 0;

function updateLanguage() {
  const l = labels[lang];
  document.documentElement.lang = l.locale;
  document.title = `${l.gate} | ADMICRO × bbk! × Vietravel Airlines`;
  $('languages').setAttribute('aria-label',l.lang);
  $('mobile-language').setAttribute('aria-label',l.lang);
  $('mobile-language').value = lang;
  document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed',button.dataset.lang === lang));
  $('lock').setAttribute('aria-label', l.lock);
  $('lock').title = l.lock;
  $('skip').textContent = l.skip;
  $('gate-badge').textContent = l.badge;
  $('gate-title').textContent = l.gate;
  $('gate-lead').textContent = l.date;
  $('form-title').textContent = l.form;
  $('form-label').textContent = l.label;
  $('preview-note').textContent = l.unavailable;
  $('submit-label').textContent = busy ? l.busy : l.open;
  $('feedback').textContent = error ? l[error] : '';
  if (content) renderMinutes();
}

function renderMinutes() {
  const d = content[lang];
  const l = labels[lang];
  const active = document.querySelector('.toc [aria-current]')?.getAttribute('href') || '#overview';
  viewVersion++;
  $('document').innerHTML = `
    <main id="main" class="wrap page" tabindex="-1">
      <section class="glass hero" aria-labelledby="main-title">
        <div class="optic" aria-hidden="true"></div>
        <div class="hero-copy">
          <span class="eyebrow">${icon('lock')}${safe(d.confidentiality)}</span>
          <h1 class="display" id="main-title">${safe(d.sourceTitle)}</h1>
          <p class="deck"><strong>${safe(d.topicLabel)}</strong> ${safe(d.topic)}</p>
        </div>
        <div class="hero-side">
          <div class="meta">${icon('calendar')}<time datetime="2026-11-19">${safe(d.date)}</time></div>
          <div class="meta">${icon('clock')}<span><strong>${safe(d.dateLabel)}</strong> ${safe(d.meetingTime)}</span></div>
          <div class="meta">${icon('place')}<span><strong>${safe(d.placeLabel)}</strong> ${safe(d.place)}</span></div>
        </div>
      </section>
      <section id="documents" class="downloads" aria-labelledby="documents-title">
        <h2 id="documents-title">${safe(d.documentHeading)}</h2>
        <div class="docs">${d.docNames.map((name,i)=>`<button type="button" class="glass doc" data-file="${i}"><span class="doc-icon">${icon('file')}</span><span><b>${safe(name)}</b><small>${safe(l.downLabel)}</small></span>${icon('down')}</button>`).join('')}</div>
        <p id="download-status" class="feedback" role="status"></p>
      </section>
      <div class="reader">
        <nav class="glass toc" aria-label="${safe(l.nav)}">${d.nav.slice(0,5).map((label,i)=>`<a href="#${ids[i]}"${active === '#'+ids[i] ? ' aria-current="location"' : ''}>${safe(label)}</a>`).join('')}</nav>
        <article class="content">
          ${d.translation ? `<p class="translation-note" role="note">${safe(d.translation)}</p>` : ''}
          <section id="attendees" class="attendee-section" aria-labelledby="attendees-title">
            <h2 id="attendees-title">${safe(d.participants)}</h2>
            <div class="people">${[[0,3],[3,6],[6,8]].map(([start,end],i)=>`<div><h3>${safe(d.groups[i])}</h3><ul>${d.attendees.slice(start,end).map(person=>`<li>${safe(person)}</li>`).join('')}</ul></div>`).join('')}</div>
          </section>
          <section id="overview" aria-labelledby="overview-title">
            <h2 id="overview-title">${safe(d.headings[0])}</h2>
            <div class="prose">${d.overview.map(p=>`<p>${safe(p)}</p>`).join('')}</div>
          </section>
          ${d.sections.map((section,i)=>`<section id="${ids[i+1]}" aria-labelledby="${ids[i+1]}-title"><h2 id="${ids[i+1]}-title">${safe(d.headings[i+1])}</h2><div class="blocks">${section.map(([title,items])=>`<div class="block"><h3>${safe(title)}</h3><ul class="prose minutes-list">${items.map(item=>`<li>${formatPoint(item)}</li>`).join('')}</ul></div>`).join('')}</div></section>`).join('')}
          <section id="actions" aria-labelledby="actions-title">
            <h2 id="actions-title">${safe(d.headings[4])}</h2>
            <div class="glass table-shell">
              <table role="table" aria-labelledby="actions-title">
                <thead role="rowgroup"><tr role="row">${d.table.map(column=>`<th scope="col" role="columnheader">${safe(column)}</th>`).join('')}</tr></thead>
                <tbody role="rowgroup">${d.actions.map(([task,owner,deadline],i)=>`<tr role="row"><td role="cell" data-label="${safe(d.table[0])}">0${i+1}</td><td role="cell" data-label="${safe(d.table[1])}">${safe(task)}</td><td role="cell" data-label="${safe(d.table[2])}">${safe(owner)}</td><td role="cell" data-label="${safe(d.table[3])}"><span class="due">${safe(deadline)}</span></td></tr>`).join('')}</tbody>
              </table>
            </div>
          </section>
          <section class="review" aria-labelledby="review-title">
            <h2 id="review-title">${safe(d.confirmation)}</h2>
            <div class="people confirmations">${d.confirmers.map((team,i)=>`<div><h3>${safe(team)}</h3>${i===0 ? `<p class="signature">${d.signature.map(s=>`<span>${safe(s)}</span>`).join('')}</p>`:''}</div>`).join('')}</div>
            <p class="prose">${safe(d.reviewText)}</p>
          </section>
        </article>
      </div>
    </main>
    <footer class="wrap"><span>admex.vn</span><span>${safe(d.confidentiality)}</span></footer>`;
}

function formatPoint(item) {
  const divider = item.search(/[:：]/);
  if (divider < 0 || divider > 105) return safe(item);
  return `<strong>${safe(item.slice(0,divider+1))}</strong>${safe(item.slice(divider+1))}`;
}

async function decrypt(name, currentKey) {
  const response = await fetch(new URL(`assets/documents/${name}.bin`, document.baseURI));
  if (!response.ok) throw new Error('Document file unavailable');
  const encrypted = await response.arrayBuffer();
  return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(meta.iv[name]),additionalData:encode.encode(name)},currentKey,encrypted);
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (busy || key) return;
  error = '';
  entry.removeAttribute('aria-invalid');
  const code = entry.value;
  if (!canUnlock || !/^\d{6}$/.test(code)) {
    error = canUnlock ? 'invalid' : 'unavailable';
    if (error === 'invalid') entry.setAttribute('aria-invalid','true');
    updateLanguage();
    entry.focus();
    return;
  }
  busy = true;
  $('submit').disabled = true;
  updateLanguage();
  try {
    const input = await crypto.subtle.importKey('raw',encode.encode(code),'PBKDF2',false,['deriveKey']);
    const candidate = await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(meta.salt),iterations:meta.iterations,hash:'SHA-256'},input,{name:'AES-GCM',length:256},false,['decrypt']);
    content = JSON.parse(decode.decode(await decrypt('content',candidate)));
    key = candidate;
    entry.value = '';
    $('gate').hidden = true;
    $('lock').hidden = false;
    $('skip').hidden = false;
    $('document').hidden = false;
  } catch (failure) {
    error = failure.name === 'OperationError' ? 'invalid' : 'assetsError';
    entry.value = '';
    if (error === 'invalid') entry.setAttribute('aria-invalid','true');
    entry.focus();
  } finally {
    busy = false;
    $('submit').disabled = false;
    updateLanguage();
  }
  if (key) {
    const target = ids.includes(location.hash.slice(1)) ? $(location.hash.slice(1)) : null;
    $('main').focus({preventScroll:true});
    if (target) target.scrollIntoView();
    else window.scrollTo(0,0);
  }
});

function switchLanguage(next) {
  if (lang === next) return;
  const anchor = content && ['attendees',...ids].map($).find(section => section && section.getBoundingClientRect().bottom > 130 && section.getBoundingClientRect().top < 150);
  const oldTop = anchor?.getBoundingClientRect().top;
  lang = next;
  updateLanguage();
  if (anchor) window.scrollBy({top:$(anchor.id).getBoundingClientRect().top-oldTop,behavior:'instant'});
}

$('languages').addEventListener('click', event => {
  const button = event.target.closest('button[data-lang]');
  if (button) switchLanguage(button.dataset.lang);
});
$('mobile-language').addEventListener('change', event => switchLanguage(event.target.value));

$('lock').addEventListener('click', () => {
  key = null;
  content = null;
  viewVersion++;
  $('document').replaceChildren();
  $('document').hidden = true;
  $('skip').hidden = true;
  $('lock').hidden = true;
  $('gate').hidden = false;
  history.replaceState(null,'',location.pathname + location.search);
  window.scrollTo(0,0);
  entry.focus();
});

$('document').addEventListener('click', async event => {
  const link = event.target.closest('.toc a');
  if (link) {
    $('document').querySelector('.toc [aria-current]')?.removeAttribute('aria-current');
    link.setAttribute('aria-current','location');
  }
  const button = event.target.closest('button[data-file]');
  if (!button || !key || button.disabled) return;
  const fileIndex = Number(button.dataset.file);
  const version = viewVersion;
  const currentKey = key;
  $('download-status').textContent = '';
  button.disabled = true;
  try {
    const data = await decrypt(fileIds[fileIndex],currentKey);
    if (key !== currentKey) return;
    const url = URL.createObjectURL(new Blob([data],{type:'application/pdf'}));
    const download = document.createElement('a');
    download.href = url;
    download.download = fileNames[fileIndex];
    document.body.append(download);
    download.click();
    download.remove();
    setTimeout(() => URL.revokeObjectURL(url),30000);
  } catch {
    if (version === viewVersion) $('download-status').textContent = labels[lang].downloadError;
  } finally {
    button.disabled = false;
  }
});

updateLanguage();
</script>
