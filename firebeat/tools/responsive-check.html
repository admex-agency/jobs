<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIREBEAT responsive QA</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#e9e9e9}header{display:flex;gap:15px;align-items:center;padding:14px;background:white;position:sticky;top:0;z-index:4}label{display:flex;gap:8px;align-items:center}select{min-height:38px;font:inherit}#stage{position:relative;margin:20px auto;overflow:hidden;background:white;box-shadow:0 4px 20px #0002}iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left}output{font-size:12px}</style><header><b>Responsive QA</b><label>Chiều rộng<select id="size"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1366</option><option>1440</option><option>1920</option></select></label><label>Khu vực<select id="section"><option value="agenda" selected>Agenda</option><option value="flavors">Vùng vị</option><option value="combos">Combo</option><option value="top">Hero</option><option value="moments">Khoảnh khắc</option><option value="venue">Bản đồ</option><option value="road">Tin tức</option><option value="merch">Quà tặng</option><option value="faq">FAQ</option><option value="footer">Footer</option></select></label><output id="result">Đang tải…</output></header><main id="stage"><iframe id="frame" title="FIREBEAT trong khung kiểm tra" src="index.html#agenda"></iframe></main><script>
const frame=document.querySelector('#frame'),stage=document.querySelector('#stage'),size=document.querySelector('#size'),section=document.querySelector('#section');function scan(){const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;const el=section.value==='footer'?d.querySelector('footer'):d.getElementById(section.value);el?.scrollIntoView({block:'start',behavior:'instant'});document.querySelector('#result').textContent='Viewport '+w.innerWidth+'px · Body '+d.body.scrollWidth+'px · '+(d.body.scrollWidth<=w.innerWidth+1?'Không tràn ngang':'TRÀN NGANG');}function resize(){const width=Number(size.value),height=900,scale=Math.min(1,(innerWidth-40)/width);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';stage.style.width=width*scale+'px';stage.style.height=height*scale+'px';setTimeout(scan,180);}size.onchange=resize;section.onchange=scan;frame.onload=()=>{resize();frame.contentDocument.fonts.ready.then(scan);};addEventListener('resize',resize);resize();
</script></html>
