<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f7">
<title>Nam Long Experience 2026 · Registration Journey</title>
<style>
  :root{
    --red:#a92b35; --ink:#2d2728; --muted:#817477;
    --paper:#fffdfd; --wash:#f7f2f2; --line:#eadede;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;min-height:100%;
    font-family:Arial,Helvetica,sans-serif;background:var(--wash);color:var(--ink);
    overflow:hidden;
  }
  .shell{
    width:100%;height:100dvh;min-height:100vh;
    display:grid;grid-template-rows:auto minmax(0,1fr);
  }
  .topbar{
    position:relative;z-index:10;background:#fffdfd;
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1480px;margin:0 auto;
    padding:14px 24px;
    display:flex;align-items:center;gap:24px;
  }
  .brand{min-width:250px}
  .eyebrow{
    font-size:10px;line-height:1.2;font-weight:700;letter-spacing:1.4px;
    color:var(--red);text-transform:uppercase
  }
  .brand-title{margin-top:4px;font-size:16px;line-height:1.2;font-weight:700}
  .tabs{
    flex:1;display:flex;justify-content:center;gap:6px;
    background:#f4eeee;border-radius:999px;padding:5px;
    max-width:660px;margin:auto;
  }
  .tab{
    appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#796d6f;cursor:pointer;
    border-radius:999px;padding:11px 18px;font-size:12px;line-height:1;font-weight:700;
    transition:.18s ease;white-space:nowrap;
  }
  .tab.active{
    background:#fffdfd;color:var(--red);
    box-shadow:0 3px 12px rgba(66,42,44,.09)
  }
  .meta{min-width:250px;text-align:right;font-size:11px;line-height:1.35;color:var(--muted)}

  .stage{
    min-height:0;
    padding:0;
    background:#eef1f4;
    overflow:hidden;
  }
  .frame-shell{
    width:100%;height:100%;
    background:#fffdfd;
    overflow:hidden;
  }
  iframe{
    width:100%;height:100%;border:0;display:block;background:#fffdfd;
  }

  @media(max-width:800px){
    .topbar-inner{
      display:block;
      padding-top:12px;
      padding-bottom:11px;
      padding-left:max(18px,calc(env(safe-area-inset-left) + 14px));
      padding-right:max(18px,calc(env(safe-area-inset-right) + 14px));
    }
    .brand{
      min-width:0;margin-bottom:12px;
      display:flex;align-items:flex-end;justify-content:space-between;gap:12px
    }
    .brand-title{font-size:14px;margin-top:3px}
    .eyebrow{font-size:9px}
    .meta{display:none}
    .tabs{
      width:100%;max-width:none;margin:0;
      overflow-x:auto;overflow-y:hidden;justify-content:flex-start;
      scrollbar-width:none;-webkit-overflow-scrolling:touch;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{
      flex:1 0 auto;min-width:max-content;
      padding:11px 14px;font-size:10px;
    }

    /* Real outer gutter for the preview, including iPhone safe areas */
    .stage{
      padding-top:12px;
      padding-bottom:max(14px,env(safe-area-inset-bottom));
      padding-left:max(14px,calc(env(safe-area-inset-left) + 10px));
      padding-right:max(14px,calc(env(safe-area-inset-right) + 10px));
      background:#f3eeee;
    }
    .frame-shell{
      border-radius:18px;
      box-shadow:0 8px 28px rgba(71,44,47,.06);
      overflow:hidden;
    }
    iframe{
      border-radius:18px;
      -webkit-overflow-scrolling:touch;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div>
          <div class="eyebrow">Client Review</div>
          <div class="brand-title">Nam Long Experience 2026</div>
        </div>
      </div>

      <nav class="tabs" aria-label="Các hạng mục">
        <button class="tab active" data-src="registration/index.html" data-hash="registration" type="button">01 · Form đăng ký</button>
        <button class="tab" data-src="confirmation-email/index.html" data-hash="confirmation" type="button">02 · Email xác nhận</button>
        <button class="tab" data-src="update-email/index.html" data-hash="update" type="button">03 · Email cập nhật</button>
      </nav>

      <div class="meta">Registration Journey<br>Final Preview</div>
    </div>
  </header>

  <main class="stage">
    <div class="frame-shell">
      <iframe id="previewFrame" src="registration/index.html" title="Nam Long Experience 2026 Preview" scrolling="yes"></iframe>
    </div>
  </main>
</div>

<script>
(() => {
  const frame = document.getElementById('previewFrame');
  const tabs = Array.from(document.querySelectorAll('.tab'));

  const routes = {
    registration: 'registration/index.html',
    confirmation: 'confirmation-email/index.html',
    update: 'update-email/index.html'
  };

  function setActive(hash, pushHash = true) {
    const src = routes[hash] || routes.registration;

    tabs.forEach(tab => {
      tab.classList.toggle('active', tab.dataset.hash === hash);
    });

    /* One iframe only: avoids iOS Safari nested-scroll lock after switching hidden iframes. */
    if (frame.getAttribute('src') !== src) {
      frame.setAttribute('src', src);
    } else {
      try { frame.contentWindow.scrollTo(0, 0); } catch(e) {}
    }

    if (pushHash) history.replaceState(null, '', '#' + hash);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => setActive(tab.dataset.hash));
  });

  const initial = location.hash.slice(1);
  if (routes[initial]) setActive(initial, false);
})();
</script>
</body>
</html>
