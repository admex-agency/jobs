<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffafa">
<title>Nam Long Experience 2026 · Client Review</title>
<style>

/* BT Beau Sans — supplied final brand font */
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-Light.ttf') format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-LightItalic.ttf') format('truetype');font-weight:300;font-style:italic;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-Italic.ttf') format('truetype');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-Medium.ttf') format('truetype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-Medium.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-MediumItalic.ttf') format('truetype');font-weight:500;font-style:italic;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-MediumItalic.ttf') format('truetype');font-weight:600;font-style:italic;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-BoldItalic.ttf') format('truetype');font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-ExtraBold.ttf') format('truetype');font-weight:800; font-style:normal;font-display:swap}
@font-face{font-family:'BT Beau Sans';src:url('fonts/BT-BeauSans-ExtraBoldItalic.ttf') format('truetype');font-weight:800; font-style:italic;font-display:swap}

:root{
  --red:#a92b35;
  --ink:#2d2728;
  --muted:#817477;
  --paper:#fffdfd;
  --wash:#f5eeee;
  --line:#eadede;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:'BT Beau Sans',sans-serif;
  background:var(--wash);
  color:var(--ink);
}
body{overflow:hidden}

.review-head{
  position:relative;
  z-index:20;
  background:#fffdfd;
  border-bottom:1px solid var(--line);
}
.review-head-inner{
  max-width:1480px;
  margin:auto;
  padding:14px 24px 13px;
  display:grid;
  grid-template-columns:260px 1fr 260px;
  align-items:center;
  gap:22px;
}
.eyebrow{
  font-size:10px;
  line-height:1.2;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--red);
}
.review-title{
  margin-top:4px;
  font-size:16px;
  line-height:1.2;
  font-weight:700;
}
.mobile-tab-select-wrap{display:none}
.mobile-tab-select{font:inherit}

.review-meta{
  text-align:right;
  font-size:11px;
  line-height:1.4;
  color:var(--muted);
}
.tabs{
  width:min(860px,100%);
  justify-self:center;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
  padding:5px;
  border-radius:999px;
  background:#f4eeee;
}
.tab{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  min-width:0;
  padding:11px 14px;
  border-radius:999px;
  background:transparent;
  color:#766a6c;
  font-size:12px;
  line-height:1.1;
  font-weight:700;
  white-space:nowrap;
  cursor:pointer;
}
.tab.active{
  color:var(--red);
  background:#fffdfd;
  box-shadow:0 3px 12px rgba(66,42,44,.09);
}

.preview-stage{
  height:calc(100dvh - 76px);
  min-height:0;
  background:#eef1f4;
}
.preview-wrap{
  width:100%;
  height:100%;
  background:#fff;
}
#previewFrame{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

@media(max-width:800px){
  body{
    overflow-x:hidden;
    overflow-y:auto;
    background:#f4eeee;
  }
  .review-head{
    position:sticky;
    top:0;
    z-index:50;
  }
  .review-head-inner{
    display:block;
    padding:
      13px max(18px,calc(env(safe-area-inset-right) + 14px))
      12px max(18px,calc(env(safe-area-inset-left) + 14px));
  }
  .review-title{font-size:14px}
  .eyebrow{font-size:9px}
  .review-meta{display:none}
  .tabs{display:none}
  .mobile-tab-select-wrap{
    display:block;
    margin-top:14px;
  }
  .mobile-tab-label{
    display:block;
    margin:0 0 7px 2px;
    font-size:9px;
    line-height:1.2;
    letter-spacing:.11em;
    text-transform:uppercase;
    font-weight:700;
    color:#9a8588;
  }
  .mobile-tab-select-box{
    position:relative;
    width:100%;
  }
  .mobile-tab-select{
    appearance:none;
    -webkit-appearance:none;
    width:100%;
    height:48px;
    padding:0 48px 0 16px;
    border:1px solid #eadede;
    border-radius:16px;
    background:#f7f2f2;
    color:var(--red);
    font-size:11.5px;
    line-height:1;
    font-weight:700;
    outline:none;
    box-shadow:none;
  }
  .mobile-tab-select:focus{
    border-color:#d8b9bc;
    box-shadow:0 0 0 3px rgba(169,43,53,.07);
  }
  .mobile-tab-chevron{
    position:absolute;
    right:17px;
    top:50%;
    width:8px;
    height:8px;
    border-right:1.6px solid #a92b35;
    border-bottom:1.6px solid #a92b35;
    transform:translateY(-68%) rotate(45deg);
    pointer-events:none;
  }

  /* Parent page scrolls; iframe is expanded to its content height.
     This avoids nested-scroll lock in Safari / Zalo / in-app browsers. */
  .preview-stage{
    height:auto;
    min-height:0;
    padding:
      14px max(14px,calc(env(safe-area-inset-right) + 10px))
      max(18px,calc(env(safe-area-inset-bottom) + 14px))
      max(14px,calc(env(safe-area-inset-left) + 10px));
    overflow:visible;
    background:#f4eeee;
  }
  .preview-wrap{
    width:100%;
    height:auto;
    overflow:hidden;
    border-radius:18px;
    background:#fffdfd;
    box-shadow:0 10px 32px rgba(70,42,45,.06);
  }
  #previewFrame{
    width:100%;
    height:1200px;
    overflow:hidden;
    border-radius:18px;
  }
}

/* Beau Sans form inheritance */
button,input,select,textarea{font-family:'BT Beau Sans',sans-serif}
</style>
</head>
<body>
<header class="review-head">
  <div class="review-head-inner">
    <div>
      <div class="eyebrow">Client Review</div>
      <div class="review-title">Nam Long Experience 2026</div>
    </div>

    <div class="mobile-tab-select-wrap">
      <label class="mobile-tab-label" for="mobileTabSelect">Chọn nội dung xem</label>
      <div class="mobile-tab-select-box">
        <select id="mobileTabSelect" class="mobile-tab-select" aria-label="Chọn nội dung xem">
          <option value="registration">01 · Form đăng ký</option>
          <option value="otp">02 · Xác thực OTP</option>
          <option value="confirmation">03 · Email xác nhận</option>
          <option value="update">04 · Email cập nhật</option>
        </select>
        <span class="mobile-tab-chevron" aria-hidden="true"></span>
      </div>
    </div>

    <nav class="tabs" aria-label="Các hạng mục">
      <button class="tab active" data-hash="registration" data-src="registration/index.html" type="button">01 · Form đăng ký</button>
      <button class="tab" data-hash="otp" data-src="otp/index.html" type="button">02 · Xác thực OTP</button>
      <button class="tab" data-hash="confirmation" data-src="confirmation-email/index.html" type="button">03 · Email xác nhận</button>
      <button class="tab" data-hash="update" data-src="update-email/index.html" type="button">04 · Email cập nhật</button>
    </nav>

    <div class="review-meta">Registration Journey<br>Final Preview</div>
  </div>
</header>

<main class="preview-stage" id="previewStage">
  <div class="preview-wrap">
    <iframe id="previewFrame" src="registration/index.html" title="Nam Long Experience 2026 Preview" scrolling="yes"></iframe>
  </div>
</main>

<script>
(() => {
  const frame = document.getElementById('previewFrame');
  const stage = document.getElementById('previewStage');
  const tabs = [...document.querySelectorAll('.tab')];
  const mobileSelect = document.getElementById('mobileTabSelect');
  const routes = {
    registration:'registration/index.html',
    confirmation:'confirmation-email/index.html',
    update:'update-email/index.html',
    otp:'otp/index.html'
  };
  let resizeObserver = null;
  let heightTimer = null;

  const isMobile = () => window.matchMedia('(max-width:800px)').matches;

  function syncScrollMode(){
    if(isMobile()){
      frame.setAttribute('scrolling','no');
      frame.style.overflow = 'hidden';
    }else{
      frame.setAttribute('scrolling','yes');
      frame.style.overflow = 'auto';
      frame.style.height = '100%';
    }
  }

  function injectMobileFixes(doc){
    if(!doc || doc.getElementById('reviewHubMobileFix')) return;
    const style = doc.createElement('style');
    style.id = 'reviewHubMobileFix';
    style.textContent = `
      @media(max-width:800px){
        html,body{
          width:100%!important;
          max-width:100%!important;
          overflow-x:hidden!important;
        }
        body{margin-left:0!important;margin-right:0!important;}
        .email-shell{
          width:100%!important;
          max-width:100%!important;
        }
      }
    `;
    doc.head.appendChild(style);
  }

  function measureFrame(){
    if(!isMobile()){
      frame.style.height = '100%';
      return;
    }
    try{
      const doc = frame.contentDocument;
      if(!doc) return;
      injectMobileFixes(doc);

      const body = doc.body;
      const html = doc.documentElement;
      const height = Math.max(
        body ? body.scrollHeight : 0,
        body ? body.offsetHeight : 0,
        html ? html.scrollHeight : 0,
        html ? html.offsetHeight : 0
      );
      if(height > 100) frame.style.height = Math.ceil(height) + 'px';
    }catch(e){}
  }

  function watchFrame(){
    if(resizeObserver){ resizeObserver.disconnect(); resizeObserver = null; }
    if(heightTimer){ clearInterval(heightTimer); heightTimer = null; }

    try{
      const doc = frame.contentDocument;
      if(!doc) return;
      injectMobileFixes(doc);

      if('ResizeObserver' in window && doc.body){
        resizeObserver = new ResizeObserver(measureFrame);
        resizeObserver.observe(doc.body);
      }
      heightTimer = setInterval(measureFrame, 500);
      setTimeout(() => {
        if(heightTimer){ clearInterval(heightTimer); heightTimer = null; }
      }, 5000);
    }catch(e){}
  }

  frame.addEventListener('load', () => {
    syncScrollMode();
    measureFrame();
    watchFrame();
    if(isMobile()){
      requestAnimationFrame(() => {
        window.scrollTo({top:stage.offsetTop - document.querySelector('.review-head').offsetHeight, behavior:'auto'});
      });
    }
  });

  function activate(hash, updateHash=true){
    const src = routes[hash] || routes.registration;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.hash === hash));
    if(mobileSelect && mobileSelect.value !== hash) mobileSelect.value = hash;

    if(frame.getAttribute('src') === src){
      measureFrame();
      if(isMobile()) window.scrollTo({top:0,behavior:'auto'});
    }else{
      frame.style.height = isMobile() ? '900px' : '100%';
      frame.setAttribute('src',src);
    }
    if(updateHash) history.replaceState(null,'','#'+hash);
  }

  tabs.forEach(tab => tab.addEventListener('click', () => activate(tab.dataset.hash)));
  if(mobileSelect) mobileSelect.addEventListener('change', () => activate(mobileSelect.value));

  window.addEventListener('resize', () => {
    syncScrollMode();
    measureFrame();
  });

  syncScrollMode();

  const initial = location.hash.slice(1);
  if(routes[initial]) activate(initial,false);
})();
</script>
</body>
</html>
